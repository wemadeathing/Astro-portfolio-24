name: Chat backend CI

on:
  push:
    paths: ['server/**', 'shared/**']
  pull_request:
    paths: ['server/**', 'shared/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
