[build]
  command = "npm run build"
  publish = "dist"

# Force www (www.nasifsalaam.com) -> apex (nasifsalaam.com) so requests match the
# canonical URLs declared in <link rel="canonical">. The Netlify dashboard has
# nasifsalaam.com set as the primary domain; redirecting in the same direction
# avoids the ERR_TOO_MANY_REDIRECTS loop that occurred when these rules pointed
# the other way.
[[redirects]]
  from = "https://www.nasifsalaam.com/*"
  to = "https://nasifsalaam.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nasifsalaam.com/*"
  to = "https://nasifsalaam.com/:splat"
  status = 301
  force = true



[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # connect-src includes api.nasifsalaam.com for the standalone chat
    # backend (server/, deployed on Railway). IMPORTANT: this must match
    # whatever custom domain actually gets attached to the Railway service —
    # update this the moment that domain is finalized, or every browser
    # request to it will be silently blocked (console-only error, no
    # network request, easy to miss since it isn't a CORS error). See
    # /Users/nasifsalaam/.claude/plans/fizzy-brewing-eagle.md §Frontend.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://api.web3forms.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://api.web3forms.com https://api.nasifsalaam.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com"
